name: Haryomix CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --check scripts/browser-interaction-smoke.mjs
      - run: npm run build
      - name: Start production preview for browser verification
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/haryomix-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
      - name: Verify browser interactions and PDF artifacts against this build
        run: node scripts/browser-interaction-smoke.mjs http://127.0.0.1:4173
