name: Deploy Haryomix to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: CLOUDFLARE_API_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Set up Wrangler
        run: npm install --global wrangler@4

      # D1 schema is idempotent; rerunning this workflow safely ensures tables exist.
      - name: Apply D1 community schema migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute haryomix-db --remote --file=migrations/0001_community.sql

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! wrangler pages project list 2>&1 | grep -Eq '(^|[[:space:]])haryomix([[:space:]]|$)'; then
            wrangler pages project create haryomix --production-branch main
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy dist --project-name=haryomix --branch=main

      - name: Verify production API and D1 connection
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code="$(curl --silent --show-error --max-time 20 --output /tmp/haryomix-health.json --write-out '%{http_code}' https://haryomix.pages.dev/api/health)" || code="000"
            body="$(cat /tmp/haryomix-health.json 2>/dev/null || true)"
            printf 'Health check attempt %s (HTTP %s): %s\\n' "$attempt" "$code" "$body"
            if [[ "$code" == "200" ]] && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' <<< "$body" && grep -Eq '"database"[[:space:]]*:[[:space:]]*"connected"' <<< "$body"; then
              echo "Production API and D1 connection verified."
              exit 0
            fi
            sleep 5
          done
          echo "Production API health or D1 connection verification failed." >&2
          exit 1

      - name: Verify community POST and persistent GET
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          marker="HARYOMIX_CI_SMOKE_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          post_id=""
          cleanup() {
            if [[ "${post_id:-}" =~ ^[0-9]+$ ]] && [[ "$post_id" != "0" ]]; then
              wrangler d1 execute haryomix-db --remote --command "DELETE FROM community_posts WHERE id = $post_id;" >/dev/null
            fi
          }
          trap cleanup EXIT

          http_code="$(curl --silent --show-error --max-time 20 --output /tmp/haryomix-post.json --write-out '%{http_code}' \
            -X POST https://haryomix.pages.dev/api/community \
            -H 'Content-Type: application/json' \
            --data "$(MARKER="$marker" python -c 'import json,os; print(json.dumps({"displayName":"Haryomix CI","message":os.environ["MARKER"]}))')")"
          cat /tmp/haryomix-post.json
          test "$http_code" = "201"
          post_id="$(python -c 'import json; print(json.load(open("/tmp/haryomix-post.json"))["post"]["id"])')"
          [[ "$post_id" =~ ^[0-9]+$ ]] && [[ "$post_id" != "0" ]]

          curl --fail --silent --show-error --max-time 20 https://haryomix.pages.dev/api/community > /tmp/haryomix-community.json
          POST_ID="$post_id" MARKER="$marker" python -c 'import json,os; d=json.load(open("/tmp/haryomix-community.json")); assert any(str(p["id"]) == os.environ["POST_ID"] and p["message"] == os.environ["MARKER"] for p in d.get("posts", [])), "POST was not returned by subsequent GET"; print("Community POST persisted and was returned by GET.")'
