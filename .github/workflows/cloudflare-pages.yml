name: Deploy Haryomix to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: CLOUDFLARE_API_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Set up Wrangler
        run: npm install --global wrangler@4

      # D1 schema is idempotent; rerunning this workflow safely ensures tables exist.
      - name: Apply D1 community schema migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler d1 execute haryomix-db --remote --file=migrations/0001_community.sql
          wrangler d1 execute haryomix-db --remote --file=migrations/0002_community_reports.sql

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! wrangler pages project list 2>&1 | grep -Eq '(^|[[:space:]])haryomix([[:space:]]|$)'; then
            wrangler pages project create haryomix --production-branch main
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          wrangler pages deploy dist --project-name=haryomix --branch=main 2>&1 | tee /tmp/haryomix-deploy.log
          deployment_url="$(grep -Eo 'https://[a-f0-9]{8}\.haryomix\.pages\.dev' /tmp/haryomix-deploy.log | tail -n 1 || true)"
          if [[ -z "$deployment_url" ]]; then
            echo "Could not extract the immutable Cloudflare Pages deployment URL." >&2
            cat /tmp/haryomix-deploy.log >&2
            exit 1
          fi
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Testing deployed version at $deployment_url"

      - name: Verify deployed workspace routes
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          routes=(
            /workspace
            /workspace/code-doctor
            /workspace/ppt-studio
            /workspace/pdf-studio
            /workspace/image-studio
            /workspace/exam-copilot
            /workspace/haryomix-ai
            /workspace/ai-create-studio
            /workspace/study-planner
            /workspace/flashcards
            /workspace/focus-timer
            /workspace/student-utilities
          )
          for route in "${routes[@]}"; do
            verified=false
            for attempt in 1 2 3 4 5; do
              code="$(curl --silent --show-error --max-time 20 --output /tmp/haryomix-route.html --write-out '%{http_code}' "$DEPLOYMENT_URL$route")" || code="000"
              if [[ "$code" == "200" ]] && grep -q 'id="root"' /tmp/haryomix-route.html; then
                verified=true
                break
              fi
              echo "Route check attempt $attempt failed for $route (HTTP $code); retrying after propagation delay."
              sleep 3
            done
            if [[ "$verified" != true ]]; then
              echo "Workspace route failed HTTP/SPA shell verification on $DEPLOYMENT_URL$route (HTTP $code)" >&2
              exit 1
            fi
            echo "Verified HTTP 200 + SPA shell: $DEPLOYMENT_URL$route"
          done
          echo "All twelve workspace URLs return the application shell."

      - name: Verify browser-rendered student workspaces
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          google-chrome --version
          while IFS='|' read -r route expected; do
            html="$(google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=8000 --dump-dom "$DEPLOYMENT_URL$route" 2>/tmp/haryomix-chrome.log)"
            if ! grep -Fq "$expected" <<< "$html"; then
              cat /tmp/haryomix-chrome.log >&2 || true
              echo "Browser-rendered UI did not contain expected marker '$expected' at $route" >&2
              exit 1
            fi
            echo "Browser-rendered UI verified: $route ($expected)"
          done <<'ROUTES'
          /|hmx-webgl-field
          /workspace|Your workspace
          /workspace/code-doctor|Code Doctor
          /workspace/ppt-studio|PPT Studio
          /workspace/pdf-studio|PDF Studio
          /workspace/image-studio|Image Studio
          /workspace/exam-copilot|Exam Copilot
          /workspace/haryomix-ai|Haryomix AI
          /workspace/ai-create-studio|AI Create Studio
          /workspace/study-planner|Study Planner
          /workspace/flashcards|Flashcards
          /workspace/focus-timer|Focus Timer
          /workspace/student-utilities|Student Utility Hub
          ROUTES

      - name: Verify browser interactions for student tools
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: node scripts/browser-interaction-smoke.mjs "$DEPLOYMENT_URL"

      - name: Verify deployed API and D1 connection
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code="$(curl --silent --show-error --max-time 20 --output /tmp/haryomix-health.json --write-out '%{http_code}' $DEPLOYMENT_URL/api/health)" || code="000"
            body="$(cat /tmp/haryomix-health.json 2>/dev/null || true)"
            printf 'Health check attempt %s (HTTP %s): %s\\n' "$attempt" "$code" "$body"
            if [[ "$code" == "200" ]] && grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' <<< "$body" && grep -Eq '"database"[[:space:]]*:[[:space:]]*"connected"' <<< "$body"; then
              echo "Production API and D1 connection verified."
              exit 0
            fi
            sleep 5
          done
          echo "Production API health or D1 connection verification failed." >&2
          exit 1

      - name: Verify deployed AI input validation without provider calls
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          check_invalid_request() {
            local route="$1"
            local payload="$2"
            local label="$3"
            local code
            code="$(curl --silent --show-error --max-time 20 --output "/tmp/haryomix-ai-$label.json" --write-out '%{http_code}' \
              -X POST "$DEPLOYMENT_URL$route" \
              -H 'Content-Type: application/json' \
              --data "$payload")"
            cat "/tmp/haryomix-ai-$label.json"
            if [[ "$code" != "400" ]]; then
              echo "Expected HTTP 400 from safe AI validation smoke test ($label), got HTTP $code" >&2
              exit 1
            fi
            echo "AI validation smoke test passed: $label (HTTP 400; no generation requested)."
          }
          check_invalid_request /api/ai/chat '{"task":"unsupported","prompt":"validation smoke"}' chat
          check_invalid_request /api/ai/image '{"prompt":"x"}' image
          check_invalid_request /api/ai/ppt '{"action":"create","query":"short"}' ppt

      - name: Verify community POST and persistent GET
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          marker="HARYOMIX_CI_SMOKE_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          post_id=""
          cleanup() {
            if [[ "${post_id:-}" =~ ^[0-9]+$ ]] && [[ "$post_id" != "0" ]]; then
              wrangler d1 execute haryomix-db --remote --command "DELETE FROM community_posts WHERE id = $post_id;" >/dev/null
            fi
          }
          trap cleanup EXIT

          http_code="$(curl --silent --show-error --max-time 20 --output /tmp/haryomix-post.json --write-out '%{http_code}' \
            -X POST $DEPLOYMENT_URL/api/community \
            -H 'Content-Type: application/json' \
            --data "$(MARKER="$marker" python -c 'import json,os; print(json.dumps({"displayName":"Haryomix CI","message":os.environ["MARKER"]}))')")"
          cat /tmp/haryomix-post.json
          test "$http_code" = "201"
          post_id="$(python -c 'import json; print(json.load(open("/tmp/haryomix-post.json"))["post"]["id"])')"
          [[ "$post_id" =~ ^[0-9]+$ ]] && [[ "$post_id" != "0" ]]

          curl --fail --silent --show-error --max-time 20 $DEPLOYMENT_URL/api/community > /tmp/haryomix-community.json
          POST_ID="$post_id" MARKER="$marker" python -c 'import json,os; d=json.load(open("/tmp/haryomix-community.json")); assert any(str(p["id"]) == os.environ["POST_ID"] and p["message"] == os.environ["MARKER"] for p in d.get("posts", [])), "POST was not returned by subsequent GET"; print("Community POST persisted and was returned by GET.")'

          report_code="$(POST_ID="$post_id" python -c 'import json,os; print(json.dumps({"postId":int(os.environ["POST_ID"]),"reason":"other","details":"CI report endpoint smoke test"}))' | curl --silent --show-error --max-time 20 --output /tmp/haryomix-report.json --write-out '%{http_code}' -X POST $DEPLOYMENT_URL/api/community/report -H 'Content-Type: application/json' --data-binary @-)"
          cat /tmp/haryomix-report.json
          test "$report_code" = "201"
          wrangler d1 execute haryomix-db --remote --command "SELECT id FROM community_reports WHERE post_id = $post_id AND details = 'CI report endpoint smoke test' AND status = 'pending' LIMIT 1;" > /tmp/haryomix-report-db.json
          grep -q '"id"' /tmp/haryomix-report-db.json
          echo "Community report endpoint stored a private pending report."

      - name: Verify moderation API rejects unauthenticated requests
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 20 --output /tmp/haryomix-moderation.json --write-out '%{http_code}' $DEPLOYMENT_URL/api/moderation)"
          cat /tmp/haryomix-moderation.json
          if [[ "$code" != "401" && "$code" != "503" ]]; then
            echo "Expected unauthenticated moderation access to return 401 or unconfigured 503, got HTTP $code" >&2
            exit 1
          fi
          if grep -q '"reports"' /tmp/haryomix-moderation.json; then
            echo "Unauthenticated moderation response unexpectedly contains reports." >&2
            exit 1
          fi
          echo "Moderation API does not expose reports without authentication."
