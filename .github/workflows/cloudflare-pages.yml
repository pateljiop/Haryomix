name: Deploy Haryomix to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: CLOUDFLARE_API_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Set up Wrangler
        run: npm install --global wrangler@4

      # D1 schema is idempotent; rerunning this workflow safely ensures tables exist.
      - name: Apply D1 community schema migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 execute haryomix-db --remote --file=migrations/0001_community.sql

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! wrangler pages project list 2>&1 | grep -Eq '(^|[[:space:]])haryomix([[:space:]]|$)'; then
            wrangler pages project create haryomix --production-branch main
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy dist --project-name=haryomix --branch=main

      - name: Verify production API and D1 connection
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            response="$(curl --silent --show-error --max-time 20 --write-out \\n%{http_code}' https://haryomix.pages.dev/api/health)" || response=\\n000'
            body="${response%\\n'*}"
            code="${response##*\\n'}"
            printf 'Health check attempt %s (HTTP %s): %s\\n' "$attempt" "$code" "$body"
            if [[ "$code" == "200" ]] && grep -q '"status":"ok"' <<< "$body" && grep -q '"database":"connected"' <<< "$body"; then
              echo "Production API and D1 connection verified."
              exit 0
            fi
            sleep 5
          done
          echo "Production API health or D1 connection verification failed." >&2
          exit 1
